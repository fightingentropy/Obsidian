name: Obsidian
options:
  bundleIdPrefix: com.md
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    # Swift 6 language mode already enables complete strict concurrency
    # checking (as errors), so SWIFT_STRICT_CONCURRENCY is not set separately.
    SWIFT_VERSION: "6.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.0
  DownGFM:
    url: https://github.com/stackotter/Down-gfm
    revision: 92ae697447a7b20ae00d0ccdeea3961627eda1c0
  Textual:
    url: https://github.com/gonzalezreal/textual
    from: 0.3.1

targets:
  Obsidian:
    type: application
    platform: macOS
    sources:
      - path: Obsidian
        excludes:
          - "Resources/katex/**"
      - path: Obsidian/Resources/katex
        type: folder
    dependencies:
      - package: Sparkle
        product: Sparkle
      - package: DownGFM
        product: Down
      - package: Textual
        product: Textual
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.md.Obsidian
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        CODE_SIGN_ENTITLEMENTS: Obsidian/Obsidian.entitlements
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: Obsidian
        PRODUCT_MODULE_NAME: Obsidian
        # The target ships the tracked Obsidian/Info.plist below, so
        # INFOPLIST_KEY_* build settings are ignored; put Info.plist keys in
        # info.properties instead.
        SPARKLE_FEED_URL: ""
        SPARKLE_PUBLIC_ED_KEY: ""
    info:
      path: Obsidian/Info.plist
      properties:
        CFBundleDisplayName: "$(PRODUCT_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        SUFeedURL: "$(SPARKLE_FEED_URL)"
        SUPublicEDKey: "$(SPARKLE_PUBLIC_ED_KEY)"
        CFBundleDocumentTypes:
          - CFBundleTypeExtensions:
              - md
              - markdown
              - mdown
              - txt
            CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSItemContentTypes:
              - net.daringfireball.markdown
              - public.plain-text
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeConformsTo:
              - public.plain-text
            UTTypeDescription: Markdown Document
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.md.obsidian.sidebar-drag-item
            UTTypeConformsTo:
              - public.data
            UTTypeDescription: Obsidian Sidebar Drag Item
  ObsidianTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ObsidianTests
    dependencies:
      - target: Obsidian
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.md.ObsidianTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Obsidian.app/Contents/MacOS/Obsidian"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Obsidian:
    build:
      targets:
        Obsidian: all
        ObsidianTests: [test]
    test:
      targets:
        - name: ObsidianTests
